<!-- ===== Primary SEO Meta Tags ===== -->

<!-- ===== Structured Data: FAQPage
     (Google shows these as expandable FAQ snippets in search results
     — only keep questions that genuinely appear as visible text on your page,
     e.g. in a "Frequently Asked Questions" section, or Google may ignore/penalize it) ===== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How is CGPA calculated?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CGPA is the credit-weighted average of your SGPA across all completed semesters. If credits aren't provided, it is calculated as a simple average of semester SGPA values."
      }
    },
    {
      "@type": "Question",
      "name": "How do I convert CGPA to percentage?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most universities use Percentage = CGPA × 9.5. Some use CGPA × 9.25, and others use (CGPA − 0.5) × 10. Check your university's official conversion formula."
      }
    },
    {
      "@type": "Question",
      "name": "Is GradeMaster free to use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, GradeMaster is completely free with no sign-up required to calculate your CGPA, SGPA, or percentage."
      }
    }
  ]
}
</script>
